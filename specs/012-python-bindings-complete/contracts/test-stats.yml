# Test Contract: Database Statistics

## Command
- **CLI**: `rustkmer stats`
- **Python**: `rustkmer.Database.get_statistics()`

## Parameters Mapping

| CLI Option | Python Parameter | Required | Type | Default | Test Required |
|-------------|------------------|----------|------|---------|--------------|
| `<DATABASE>` | `database` | Yes | Database | - | ✅ |
| `-f, --format` | `format` | No | str | "text" | ✅ |
| `-o, --output` | N/A (CLI only) | No | str | - | ⚠️ |
| `--detailed` | `detailed` | No | bool | False | ⚠️ |
| `--max-bins` | `max_bins` | No | int | 1000 | ⚠️ |
| `--approximate` | `approximate_median` | No | bool | False | ⚠️ |
| `-p, --progress` | N/A (CLI only) | No | bool | - | ❌ |
| `--split-output` | `split_output` | No | bool | False | ⚠️ |
| `--freq-output` | `freq_output_file` | No | str | - | ⚠️ |

## Output Formats

| Format | Description | Python Method |
|--------|------------|---------------|
| text | Human readable sections | `get_statistics(format="text")` |
| json | Structured JSON | `get_statistics(format="json")` |
| csv | Tabular with headers | `get_statistics(format="csv")` |
| tsv | Tab-separated values | `get_statistics(format="tsv")` |

## Statistics Properties

| Property | Description | Test Required |
|----------|-------------|--------------|
| kmer_size | K-mer size used | ✅ |
| total_kmers | Total k-mer count | ✅ |
| unique_kmers | Unique k-mer sequences | ✅ |
| canonical | Whether canonical k-mers | ⚠️ |
| coverage | Estimated coverage | ⚠️ |
| histogram | Count frequency distribution | ⚠️ |
| percentiles | P25, P50, P75, P95, P99 | ⚠️ |
| min_count | Minimum k-mer count | ⚠️ |
| max_count | Maximum k-mer count | ⚠️ |
| median_count | Median k-mer count | ⚠️ |
| mean_count | Mean k-mer count | ⚠️ |

