## Error Conditions

| Condition | Expected Behavior |
|-----------|-------------------|
| Non-existent database | FileNotFoundError |
| Corrupted database | DatabaseCorruptionError |
| Invalid format | ValueError |
| Permission denied | PermissionError |

## Validation Rules

### 1. Basic Statistics
- Total k-mers = sum of all counts
- Unique k-mers = number of distinct k-mers
- Coverage estimate based on genome size

### 2. Histogram Validation
- Bins cover count range appropriately
- Total frequency matches total k-mers
- Bins are sorted by count

### 3. Percentile Validation
- P50 ≤ median ≤ P75
- Values are within count range
- Correct interpolation for percentiles

### 4. Format Validation
- Text: Human readable sections
- JSON: Valid JSON structure
- CSV: Proper headers and rows
- TSV: Tab-separated values

## Test Data Requirements

### Database with Known Properties
```python
def create_test_database_with_known_stats(k=21, num_kmers=1000):
    """Create database with predictable statistics"""
    counter = KmerCounter(k=k)

    # Create predictable distribution
    for i in range(num_kmers):
        count = i + 1  # Linear distribution
        seq = generate_kmer_sequence(i, k)
        counter.count_string(seq * count)

    return counter
```

## Success Criteria

1. All format outputs match CLI exactly
2. Statistics calculations are mathematically correct
3. Histogram and percentiles are accurate
4. Performance scales with database size
5. Memory usage is reasonable for large databases