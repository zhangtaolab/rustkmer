```python
def test_fuzzy_query_basic():
    """Test basic fuzzy query with wildcards"""
    # CLI: rustkmer fuzzy-query db.rkdb ATCGATCGATNGATCG
    # Python: FuzzyQuery(db).query("ATCGATCGATNGATCG")
```

