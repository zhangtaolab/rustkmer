# Test Contract: Fuzzy Query

## Command
- **CLI**: `rustkmer fuzzy-query`
- **Python**: `rustkmer.FuzzyQuery` or `rustkmer.FuzzyQueryEngine`

## Parameters Mapping

| CLI Option | Python Parameter | Required | Type | Default | Test Required |
|-------------|------------------|----------|------|---------|--------------|
| `<DATABASE>` | `database` | Yes | Database | - | ✅ |
| `<QUERY>` | `query()` argument | Yes | str | - | ✅ |
| `-m, --mutations` | `max_mutations` | No | int | 0 | ✅ |
| `-M, --max-variants` | `max_variants` | No | int | 10000 | ⚠️ |
| `-p, --parallel` | `parallel` | No | bool | True | ⚠️ |
| `-b, --batch-size` | `batch_size` | No | int | 1000 | ⚠️ |
| `-f, --format` | `set_format()` | No | str | "table" | ⚠️ |
| `-o, --output` | `set_output()` | No | str | - | ⚠️ |
| `-v, --verbose` | N/A | No | bool | - | ❌ |
| `-q, --quiet` | N/A | No | bool | - | ❌ |
| `--profile` | `enable_profiling()` | No | - | False | ⚠️ |

## Output Formats

| Format | Description | Python Method |
|--------|------------|---------------|
| table | Tabular format | Default return |
| json | JSON array | `set_format("json")` |
| tsv | Tab-separated | `set_format("tsv")` |
| csv | Comma-separated | `set_format("csv")` |

## Fuzzy Query Methods

| Method | Python Equivalent | Test Required |
|--------|-------------------|--------------|
| Single query | `query(pattern)` | ✅ |
| Search | `search(pattern)` | ⚠️ |
| Similar k-mers | `find_similar(kmer)` | ⚠️ |

