## Error Conditions

| Condition | Expected Behavior |
|-----------|-------------------|
| Invalid pattern | ValueError |
| Mutation > k | ValueError |
| Database not loaded | DatabaseError |
| Invalid format | ValueError |

## Validation Rules

1. **Pattern validation**:
   - Length must match k-mer size
   - Only A, C, G, T, N allowed
   - N is wildcard for any nucleotide

2. **Distance constraints**:
   - 0 ≤ mutations ≤ k-mer size
   - Distance is Hamming distance

3. **Result validation**:
   - Each result includes kmer, count, distance
   - Results sorted by distance then count
   - Variant count respected

4. **Performance requirements**:
   - O(4^m) complexity where m = mutations
   - Parallel processing for multiple variants
   - Early termination with max_variants

## Success Criteria

1. All wildcard patterns work correctly
2. Hamming distance calculation accurate
3. Output formats match CLI exactly
4. Performance scales as expected
5. Thread-safe for concurrent queries