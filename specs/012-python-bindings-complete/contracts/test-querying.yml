## Validation Rules

1. **Database validation**:
   - Must be valid RKDB format
   - Version compatibility
   - Integrity check

2. **K-mer validation**:
   - Length must match database k-mer size
   - Only valid nucleotides (A, C, G, T)

3. **Query results**:
   - Single query returns integer count
   - Batch query returns dictionary
   - Non-existent k-mer returns 0

4. **Performance requirements**:
   - O(1) lookup time
   - Memory-mapped access for large databases
   - Thread-safe concurrent access

## Success Criteria

1. All query operations work identically to CLI
2. Database properties are accessible
3. Error conditions raise appropriate exceptions
4. Concurrent access is thread-safe
5. Memory usage scales with database size