# Test Contract: Database Querying

## Command
- **CLI**: `rustkmer query`
- **Python**: `rustkmer.Database`

## Parameters Mapping

| CLI Option | Python Method/Property | Required | Type | Default | Test Required |
|-------------|-----------------------|----------|------|---------|--------------|
| `<DATABASE>` | `load(path)` | Yes | str | - | ✅ |
| `[KMERS]...` | `query(kmer)` | No | str | - | ✅ |
| `-s, --sequence` | `query_from_file(path)` | No | str | - | ⚠️ |
| `-o, --output` | N/A (CLI only) | No | str | - | ⚠️ |
| `-i, --interactive` | N/A (CLI only) | No | bool | - | ❌ |
| `-l, --load` | `load(path, preload=True)` | No | bool | True | ⚠️ |
| `-L, --no-load` | `load(path, preload=False)` | No | bool | False | ⚠️ |

## Database Properties

| Property | Python Access | Test Required |
|----------|----------------|--------------|
| kmer_size | `db.kmer_size` | ✅ |
| total_kmers | `db.total_kmers` | ✅ |
| unique_kmers | `db.unique_kmers` | ✅ |
| metadata | `db.metadata` | ⚠️ |

## Query Methods

| Method | Python Equivalent | Test Required |
|--------|-------------------|--------------|
| Single query | `query(kmer: str) -> int` | ✅ |
| Batch query | `query_batch(kmers: List[str]) -> Dict[str, int]` | ✅ |
| File query | `query_from_file(path: str) -> Dict[str, int]` | ⚠️ |
| Existence check | `exists(kmer: str) -> bool` | ✅ |
| List all k-mers | `get_kmers() -> List[str]` | ⚠️ |
| Get all counts | `get_counts() -> List[int]` | ⚠️ |
| Iterator | `iter_kmers() -> Iterator[Tuple[str, int]]` | ⚠️ |

## Error Code Mapping

| CLI Exit Code | Python Exception | Test Required |
|---------------|-----------------|--------------|
| 1 | `FileNotFoundError`, `DatabaseError` | ⚠️ |
| 3 | `DatabaseCorruptionError` | ⚠️ |

