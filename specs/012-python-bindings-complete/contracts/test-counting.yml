# Test Contract: K-mer Counting

## Command
- **CLI**: `rustkmer count`
- **Python**: `rustkmer.KmerCounter`

## Parameters Mapping

| CLI Option | Python Parameter | Required | Type | Default | Test Required |
|-------------|------------------|----------|------|---------|--------------|
| `-k, --k` | `k` | Yes | int | 21 | ✅ |
| `-C, --canonical` | `canonical` | No | bool | False | ✅ |
| `-t, --threads` | `threads` | No | int | 0 | ✅ |
| `--size` | `hash_size` | No | int | 1000000 | ⚠️ |
| `--sort` | `sort_output` | No | bool | True | ⚠️ |
| `--no-sort` | `sort_output=False` | No | bool | - | ⚠️ |
| `-L, --min-count` | `min_count` | No | int | 1 | ⚠️ |
| `-U, --max-count` | `max_count` | No | int | None | ⚠️ |
| `-q, --quiet` | `quiet` | No | bool | False | ⚠️ |
| `-v, --verbose` | `verbose` | No | bool | False | ⚠️ |
| `--show-warnings` | N/A | No | - | - | ❌ |

## Input Mapping

| CLI Option | Python Method | Test Required |
|-------------|---------------|--------------|
| `-i, --input` | `count_file()` / `count_files()` | ✅ |
| `-d, --directory` | `count_directory()` | ⚠️ |
| `-s, --select` | N/A (Interactive) | ❌ |
| `--recursive` | `count_directory(recursive=True/False)` | ⚠️ |

## Output Mapping

| CLI Option | Python Method | Format | Test Required |
|-------------|---------------|--------|--------------|
| `-o, --output` | `save_to_database()` | `.rkdb` | ✅ |
| `--format` | `save_to_database(format=...)` | binary/text | ⚠️ |

## Error Code Mapping

| CLI Exit Code | Python Exception | Test Required |
|---------------|-----------------|--------------|
| 1 | `FileNotFoundError`, `PermissionError` | ⚠️ |
| 2 | `KmerSizeError`, `ValueError` | ⚠️ |
| 4 | `SequenceError` | ⚠️ |
| 5 | `MemoryError` | ⚠️ |

