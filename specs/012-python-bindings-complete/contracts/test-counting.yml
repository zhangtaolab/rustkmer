## Validation Rules

1. **K-mer size validation**:
   - Must be 1-64
   - CLI error: exit code 2
   - Python: raises `ValueError` or `KmerSizeError`

2. **Input validation**:
   - Must exist and be readable
   - Must be valid FASTA/FASTQ
   - CLI error: exit code 1 or 4
   - Python: raises `FileNotFoundError` or `SequenceError`

3. **Output validation**:
   - Database must be valid RKDB format
   - Must contain expected k-mers
   - Verify k-mer size matches

4. **Performance requirements**:
   - Memory usage O(n*k)
   - Parallel speedup with threads
   - Streaming for large files

## Success Criteria

1. All CLI options have Python equivalent tests
2. Output files are identical (byte-for-byte)
3. Error codes map to correct exceptions
4. Performance within 10% of CLI
5. Thread safety for concurrent operations