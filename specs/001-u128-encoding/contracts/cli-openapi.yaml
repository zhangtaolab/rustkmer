openapi: 3.0.3
info:
  title: RustKmer CLI API
  version: 2.0.0
  description: Command-line interface for k-mer database operations with u128 support

paths:
  /count:
    post:
      summary: Count k-mers in FASTA/FASTQ file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                  format: path
                k:
                  type: integer
                  minimum: 1
                  maximum: 64
                output:
                  type: string
                  format: path
                canonical:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Database created successfully

  /query:
    post:
      summary: Query k-mer count in database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                database:
                  type: string
                  format: path
                kmer:
                  type: string
                  pattern: '^[ACGTacgt]+$'
                fuzzy:
                  type: boolean
                  default: false
                max_distance:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 0
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        kmer:
                          type: string
                        count:
                          type: integer
                        distance:
                          type: integer

  /dump:
    post:
      summary: Dump database contents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                database:
                  type: string
                  format: path
                output:
                  type: string
                  format: path
                format:
                  type: string
                  enum: [tsv, csv, json]
      responses:
        '200':
          description: Database dumped successfully

  /merge:
    post:
      summary: Merge multiple databases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                databases:
                  type: array
                  items:
                    type: string
                    format: path
                output:
                  type: string
                  format: path
      responses:
        '200':
          description: Databases merged successfully