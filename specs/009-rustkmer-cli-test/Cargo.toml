[package]
name = "rustkmer_test"
version = "0.1.0"
edition = "2021"
authors = ["Test Suite"]
description = "Test framework for RustKmer CLI"

[[bin]]
name = "rustkmer_test"
path = "src/main.rs"

[dependencies]
# 性能监控和序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志记录
log = "0.4"
env_logger = "0.10"

# 并发处理（如果需要）
rayon = "1.8"

# 随机数生成
rand = "0.8"

[dev-dependencies]
# 测试相关
tempfile = "3.8"

# 基准测试
criterion = "0.5"

[[bench]]
name = "count_benchmark"
harness = false