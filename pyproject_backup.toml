[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustkmer"
version = "0.1.0"
description = "High-performance k-mer counting, database queries, and fuzzy search for genomic data analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "RustKmer Team", email = "rustkmer@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "genomics", "k-mer", "sequence-analysis", "rust"]

[project.urls]
Homepage = "https://github.com/your-org/rustkmer"
Documentation = "https://rustkmer.readthedocs.io/"
Repository = "https://github.com/your-org/rustkmer.git"
"Bug Tracker" = "https://github.com/your-org/rustkmer/issues"

[tool.maturin]
python-source = "python"
module-name = "rustkmer._rustkmer"
features = ["python"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip = "pp* *-win32 *-manylinux_i686"
test-command = "python -c 'import rustkmer; print(rustkmer.__version__)'"