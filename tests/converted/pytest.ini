[pytest]
# pytest configuration for converted RustKmer tests

# Test discovery
testpaths = tests tests/converted
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --color=yes
    -ra

# Markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for API workflows
    performance: Performance tests (may be slow)
    slow: Slow tests that may be skipped with -m "not slow"
    memory: Tests that check memory usage
    cli: Tests that require CLI binary
    converted: Tests converted from root directory

# Minimum version
minversion = 6.0

# Filtering warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# Test session timeout (in seconds)
timeout = 300