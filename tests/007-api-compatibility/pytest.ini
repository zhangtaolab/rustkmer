[tool:pytest]
testpaths = tests/007-api-compatibility
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
markers =
    compatibility: Compatibility tests between CLI and Python API
    performance: Performance benchmarking tests
    slow: Tests that take more than 10 seconds
    integration: Integration tests
    unit: Unit tests