[pytest]
# pytest configuration for RustKmer Python tests

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --color=yes
    -ra

# Markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for API workflows
    performance: Performance tests (may be slow)
    slow: Slow tests that may be skipped with -m "not slow"
    memory: Tests that check memory usage
    cli: Tests that require CLI binary

# Minimum version
minversion = 6.0

# Filtering warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# Test session timeout (in seconds)
timeout = 300

# Parallel execution
# addopts = -n auto  # Uncomment to enable parallel testing with pytest-xdist

# Coverage
# addopts = --cov=rustkmer --cov-report=term-missing --cov-report=html  # Uncomment for coverage

# Test fixtures
# usefixtures = ...  # Add common fixtures here