[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustkmer"
version = "0.1.0"
description = "High-performance k-mer counting and querying for Python"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Forrest Li", email = "forrest@example.com"},
]
keywords = ["bioinformatics", "genomics", "kmer", "sequencing", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
      "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/yourusername/rustkmer"
Documentation = "https://rustkmer.readthedocs.io/"
Repository = "https://github.com/yourusername/rustkmer"
"Bug Tracker" = "https://github.com/yourusername/rustkmer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[tool.maturin]
python-source = "python"
module-name = "rustkmer._rustkmer"
features = ["pyo3/extension-module", "python"]
# Module name is correct for PyO3 - rustkmer._rustkmer means:
# - Package name: rustkmer
# - Module name: _rustkmer (C extension module)
# - Function name: rustkmer (PyO3 generates PyInit_rustkmer)
# - features: Enable pyo3 extension-module and our python feature

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.coverage.run]
source = ["python/rustkmer", "tests/python"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]