# Cargo configuration for RustKmer Python bindings
# This configuration fixes Python extension linking on macOS ARM64

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-L/Users/forrest/miniconda3/lib",
    "-C", "link-arg=-lpython3.13",
    "-C", "link-arg=-Wl,-rpath,/Users/forrest/miniconda3/lib"
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-L/Users/forrest/miniconda3/lib",
    "-C", "link-arg=-lpython3.13",
    "-C", "link-arg=-Wl,-rpath,/Users/forrest/miniconda3/lib"
]

# For future Linux support
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-L/usr/lib/x86_64-linux-gnu",
    "-C", "link-arg=-lpython3.13"
]