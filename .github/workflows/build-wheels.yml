name: Build and Upload Python Wheels

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.17.0
      env:
        # Disable 32-bit builds to reduce CI time
        CIBW_SKIP: "*-win32 *-manylinux_i686 pp*-win32 pp*-manylinux_i686"
        # Enable testing
        CIBW_TEST_REQUIRES: pytest numpy
        CIBW_TEST_COMMAND: python -c "import rustkmer; from rustkmer import KmerCounter, Database, FuzzyQuery; print('✓ Wheel test passed')"
        # Target Python versions
        CIBW_PYTHON_VERSIONS: "3.8 3.9 3.10 3.11 3.12 3.13"

    - uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build source distribution
      run: maturin build --release --sdist --out dist

    - uses: actions/upload-artifact@v3
      with:
        name: sdist
        path: dist/*.tar.gz

  test:
    name: Test wheels
    needs: [build_wheels, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download wheels
      uses: actions/download-artifact@v3
      with:
        pattern: wheels-${{ matrix.os }}
        merge-multiple: true

    - name: Download source distribution
      uses: actions/download-artifact@v3
      with:
        name: sdist
        path: dist-source

    - name: Install and test wheel
      run: |
        # Install wheel if available, otherwise fall back to source
        if ls *.whl 1> /dev/null 2>&1; then
          pip install *.whl --force-reinstall
        else
          pip install dist-source/*.tar.gz --force-reinstall
        fi

        # Test basic import and functionality
        python -c "
import rustkmer
print('✓ Import successful')
print('✓ Python bindings working')

# Test basic functionality
from rustkmer import KmerCounter, Database, FuzzyQuery
counter = KmerCounter(k=21, canonical=True)
db = Database(k=21)
fq = FuzzyQuery(k=21, max_distance=1)

print('✓ All functionality tests passed')
"

  publish:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/checkout@v4

    - name: Download all wheels
      uses: actions/download-artifact@v3
      with:
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true