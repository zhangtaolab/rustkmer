name: Python API Compatibility Tests

on:
  push:
    branches: [main, 012-python-bindings-complete]
  pull_request:
    branches: [main, 012-python-bindings-complete]
  schedule:
    # Run daily at 2 AM UTC for performance tracking
    - cron: '0 2 * * *'

jobs:
  compatibility-tests:
    name: CLI-Python Compatibility Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          # Windows doesn't have Python 3.8 by default
          - os: windows-latest
            python-version: '3.8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          python/.venv
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('python/pyproject.toml', 'python/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin[patchelf] pytest numpy scipy matplotlib seaborn
        pip install -r python/requirements-dev.txt || true

    - name: Lint Rust code
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Format check Rust code
      run: cargo fmt --all -- --check

    - name: Build RustKmer (Release)
      run: cargo build --release

    - name: Build Python bindings
      run: |
        cd python
        maturin develop --release

    - name: Run Rust tests
      run: cargo test --release

    - name: Run Python unit tests
      run: |
        cd python
        python -m pytest tests/ -v || true  # Don't fail the build if Python tests fail initially

    - name: Run compatibility tests
      run: |
        python tests/python/compatibility/runner.py \
          --output compatibility_report_${{ matrix.os }}_${{ matrix.python-version }}.json \
          --cli-binary ./target/release/rustkmer

    - name: Run performance regression tests
      run: |
        python tests/python/compatibility/performance_regression.py \
          --iterations 3 \
          --baseline-days 7

    - name: Generate compatibility report
      run: |
        python -c "
        from tests.python.compatibility.reporting import ReportGenerator, ResultComparator
        import json

        # Load test results
        with open('compatibility_report_${{ matrix.os }}_${{ matrix.python-version }}.json', 'r') as f:
            data = json.load(f)

        # Generate comparison analysis
        comparator = ResultComparator()
        comparison = comparator.compare_results(data['results'])
        data['comparison'] = comparison.__dict__

        # Generate reports
        generator = ReportGenerator()
        html_path = generator.generate_html_report(data)
        md_path = generator.generate_markdown_report(data)

        print(f'HTML report: {html_path}')
        print(f'Markdown report: {md_path}')
        "

    - name: Upload compatibility reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compatibility-reports-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          compatibility_report_${{ matrix.os }}_${{ matrix.python-version }}.json
          compatibility_reports/
          performance_plots/
        retention-days: 30

    - name: Check for critical regressions
      run: |
        python -c "
        import json
        import sys

        try:
            with open('performance_data/performance_regressions.json', 'r') as f:
                regressions = json.load(f)

            critical = [r for r in regressions if r.get('severity') == 'critical']
            if critical:
                print('🚨 CRITICAL PERFORMANCE REGRESSIONS DETECTED:')
                for r in critical:
                    print(f'  - {r[\"test_name\"]}: {r[\"regression_percent\"]:.1f}% regression')
                sys.exit(1)
            else:
                print('✅ No critical performance regressions')
        except FileNotFoundError:
            print('No previous performance data to compare')
        except Exception as e:
            print(f'Error checking regressions: {e}')
        "

  performance-trends:
    name: Performance Trends Analysis
    runs-on: ubuntu-latest
    needs: compatibility-tests
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy scipy matplotlib seaborn

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: compatibility-reports-*
        merge-multiple: true

    - name: Generate performance trends
      run: |
        python -c "
        from tests.python.compatibility.reporting import ReportGenerator
        import json
        import glob

        # Collect all test results
        all_data = {'summary': {}, 'results': {}}
        report_files = glob.glob('compatibility_report_*.json')

        for report_file in report_files:
            with open(report_file, 'r') as f:
                data = json.load(f)

            # Extract OS and Python version from filename
            parts = report_file.replace('compatibility_report_', '').replace('.json', '').split('_')
            os_name = parts[0]
            python_ver = parts[1] if len(parts) > 1 else 'unknown'

            # Merge results
            for test_name, result in data['results'].items():
                key = f'{os_name}_{python_ver}_{test_name}'
                all_data['results'][key] = result

        # Generate comprehensive report
        generator = ReportGenerator()
        html_path = generator.generate_html_report(all_data)
        md_path = generator.generate_markdown_report(all_data)
        plots = generator.generate_performance_plots(all_data['results'])

        print(f'Generated comprehensive report:')
        print(f'  HTML: {html_path}')
        print(f'  Markdown: {md_path}')
        print(f'  Plots: {plots}')
        "

    - name: Upload trend analysis
      uses: actions/upload-artifact@v4
      with:
        name: performance-trends
        path: |
          compatibility_reports/
          performance_plots/
        retention-days: 90

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: compatibility-tests
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: compatibility-reports-*
        merge-multiple: true

    - name: Generate summary
      run: |
        python -c "
        import json
        import glob

        # Collect all test results
        total_tests = 0
        total_passed = 0
        failed_configs = []

        for report_file in glob.glob('compatibility_report_*.json'):
            with open(report_file, 'r') as f:
                data = json.load(f)

            total_tests += data['summary']['total_tests']
            total_passed += data['summary']['passed']

            if data['summary']['failed'] > 0:
                failed_configs.append(report_file.replace('compatibility_report_', '').replace('.json', ''))

        pass_rate = (total_passed / total_tests * 100) if total_tests > 0 else 0

        print('## Compatibility Test Summary')
        print(f'- Total Tests: {total_tests}')
        print(f'- Passed: {total_passed}')
        print(f'- Failed: {total_tests - total_passed}')
        print(f'- Pass Rate: {pass_rate:.1f}%')

        if failed_configs:
            print('')
            print('### Failed Configurations')
            for config in failed_configs:
                print(f'- {config}')

        # Add to GitHub summary
        with open('test_summary.md', 'w') as f:
            f.write('## Compatibility Test Summary\n\n')
            f.write(f'- **Total Tests**: {total_tests}\n')
            f.write(f'- **Passed**: {total_passed}\n')
            f.write(f'- **Failed**: {total_tests - total_passed}\n')
            f.write(f'- **Pass Rate**: {pass_rate:.1f}%\n\n')

            if failed_configs:
                f.write('### Failed Configurations\n\n')
                for config in failed_configs:
                    f.write(f'- {config}\n')
        "

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          try {
            const summary = fs.readFileSync('test_summary.md', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          } catch (error) {
            console.log('Could not create comment:', error);
          }

    - name: Upload test summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test_summary.md