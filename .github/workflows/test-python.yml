name: Build and Test Python Bindings

on:
  push:
    branches: [ main, master, develop, '001-python-bindings' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_python:
    name: Test Python bindings on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin[patchelf] pytest pytest-cov numpy

    - name: Check code formatting
      run: |
        cargo fmt --all -- --check

    - name: Run clippy
      run: |
        cargo clippy --features python -- -D warnings

    - name: Build Rust with Python feature
      run: |
        cargo build --release --features python

    - name: Test Rust library
      run: |
        cargo test --release --features python --lib

    - name: Build Python extension
      run: |
        maturin develop --features python

    - name: Test Python import
      run: |
        python -c "
import rustkmer
print('✓ Python import successful')
print('✓ Module loaded:', rustkmer.__name__ if hasattr(rustkmer, '__name__') else 'rustkmer')
print('✓ Package available')
"

    - name: Test basic functionality
      run: |
        python -c "
import rustkmer
from rustkmer import KmerCounter, Database, FuzzyQuery

# Test KmerCounter creation
counter = KmerCounter(k=21, canonical=False)
print('✓ KmerCounter created:', counter.get_k())

# Test Database creation
db = Database(k=21)
print('✓ Database created:', db.get_k())

# Test FuzzyQuery creation
fq = FuzzyQuery(k=21, max_distance=1)
print('✓ FuzzyQuery created:', fq.get_k())

print('✓ All basic functionality tests passed')
"

    - name: Run Python unit tests
      run: |
        if [ -d "tests/python" ]; then
          python -m pytest tests/python/ -v --cov=rustkmer --cov-report=xml
        else
          echo "Python tests not found - skipping"
        fi

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false