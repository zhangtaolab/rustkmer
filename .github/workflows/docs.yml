name: Documentation Build and Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'python/**'
      - 'mkdocs.yml'
      - '.pydocstylerc'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for version info

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-docs-

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Validate docstring quality
      run: |
        echo "Checking Python docstring quality..."
        # Check main Python files
        python -m pydocstyle python/rustkmer/ --config=.pydocstylerc || echo "Docstring issues found"

        # Count violations (non-blocking for now)
        echo "Docstring validation completed"

    - name: Build documentation
      run: |
        echo "Building documentation..."
        cd docs
        mkdocs build --strict

        # Check if docs were built successfully
        if [ ! -d "../site" ]; then
          echo "Documentation build failed - no site directory created"
          exit 1
        fi

        echo "Documentation built successfully"

    - name: Check for broken links
      run: |
        echo "Checking for broken links..."
        cd docs

        # Create a simple link checker using Python
        python -c "
import os
import re
from pathlib import Path

site_dir = Path('../site')
if not site_dir.exists():
    print('No site directory to check')
    exit(0)

# Find all HTML files and check for internal links
broken_links = []
for html_file in site_dir.rglob('*.html'):
    try:
        with open(html_file, 'r', encoding='utf-8') as f:
            content = f.read()

        # Check for broken internal links
        internal_links = re.findall(r'href=\"([^\"#]+)\"', content)
        for link in internal_links:
            if link.startswith('http'):
                continue  # Skip external links
            if link.startswith('#'):
                continue  # Skip anchor links
            if link.startswith('mailto:'):
                continue  # Skip mailto links
            if link.startswith('../'):
                # Check if relative path exists
                target_path = html_file.parent / link
                if not target_path.exists():
                    broken_links.append(f'{html_file}: {link}')
    except Exception as e:
        print(f'Error checking {html_file}: {e}')

if broken_links:
    print(f'Found {len(broken_links)} broken links:')
    for link in broken_links[:10]:  # Show first 10
        print(f'  {link}')
    if len(broken_links) > 10:
        print(f'  ... and {len(broken_links) - 10} more')
    exit(1)
else:
    print('No broken internal links found')
"

    - name: Generate documentation stats
      run: |
        cd docs
        echo "Documentation Statistics:"
        echo "======================="

        # Count pages
        page_count=$(find ../site -name "*.html" | wc -l)
        echo "HTML pages: $page_count"

        # Check size
        if [ -d "../site" ]; then
            du -sh ../site
        fi

        # Show API coverage
        echo "API Coverage:"
        python -c "
import sys
sys.path.insert(0, '../python')
from rustkmer import database, fuzzy_query, query, stats, exceptions

# Count classes and methods
import inspect

modules = [database, fuzzy_query, query, stats, exceptions]
total_classes = 0
total_methods = 0
documented_methods = 0

for module in modules:
    for name, obj in inspect.getmembers(module, inspect.isclass):
        if obj.__module__ == module.__name__:
            total_classes += 1
            for method_name, method_obj in inspect.getmembers(obj, inspect.ismethod):
                if not method_name.startswith('_'):
                    total_methods += 1
                    if method_obj.__doc__:
                        documented_methods += 1

print(f'Classes: {total_classes}')
print(f'Public methods: {total_methods}')
print(f'Documented methods: {documented_methods}')
if total_methods > 0:
    coverage = (documented_methods / total_methods) * 100
    print(f'Documentation coverage: {coverage:.1f}%')
"

    - name: Deploy to GitHub Pages
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          cd docs

          # Configure git user
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Deploy to GitHub Pages
          mkdocs gh-deploy --force --clean

    - name: Upload documentation artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: site/
        retention-days: 30

  test-docs:
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download documentation artifact
      uses: actions/download-artifact@v4
      with:
        name: documentation-site
        path: site/

    - name: Test documentation links
      run: |
        echo "Testing documentation accessibility..."
        # Basic check that key pages exist
        if [ -f "site/index.html" ]; then
          echo "✓ Home page exists"
        else
          echo "✗ Home page missing"
          exit 1
        fi

        # Check for key API documentation
        api_pages=("database" "fuzzyquery" "exceptions" "query" "stats")
        for page in "${api_pages[@]}"; do
          if [ -f "site/api-reference/${page}.html" ] || [ -f "site/api-reference/${page}/index.html" ]; then
            echo "✓ ${page} API docs exist"
          else
            echo "✗ ${page} API docs missing"
          fi
        done

    - name: Validate MkDocs configuration
      run: |
        echo "Validating MkDocs configuration..."
        cd docs
        mkdocs --version
        mkdocs build --clean --quiet

        # Test that docs build without errors
        if mkdocs build --quiet --strict; then
          echo "✓ MkDocs configuration is valid"
        else
          echo "✗ MkDocs configuration has errors"
          exit 1
        fi

    - name: Check Python examples in documentation
      run: |
        echo "Testing Python examples from documentation..."
        # Find Python code blocks in documentation
        find site -name "*.html" -exec grep -l "python.*{}" {} \; | while read file; do
          echo "Testing examples in: $file"
        done || echo "No Python examples found to test"