[package]
name = "rustkmer"
version = "0.1.0"
edition = "2021"
authors = ["Forrest Li <forrest@example.com>"]
description = "High-performance k-mer counting tool in Rust"
license = "MIT"
repository = "https://github.com/yourusername/rustkmer"
keywords = ["bioinformatics", "genomics", "kmer", "sequencing"]
categories = ["science", "command-line-utilities"]

[dependencies]
# CLI framework
clap = { version = "4.5.53", features = ["derive"] }


# Error handling
thiserror = "2.0.17"
anyhow = "1.0"

# Parallel processing
rayon = "1.10"

# Bioinformatics
bio = "2.0"

# Memory management
memmap2 = "0.9"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = "1.3"

# Binary I/O
byteorder = "1.5"

# CSV support
csv = "1.3"

# Small vector optimization
smallvec = "1.13"

# High-performance hash map
hashbrown = "0.14"
ahash = "0.8"

# Streaming quantile estimation
tdigest = "0.2"

# Property-based testing
proptest = "1.5"

# Synchronization primitives
parking_lot = "0.12"

# CPU count
num_cpus = "1.16"

# Progress reporting
indicatif = "0.17"

# Interactive file selection
inquire = "0.7"

# Directory traversal
walkdir = "2.4"

# Compression support
niffler = "2.5"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"

# Additional compression for database persistence
sha2 = "0.10"

# Date/time handling for metadata
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
tempfile = "3.12"
proptest = "1.5"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "rustkmer"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

# Python bindings enabled with feature flag
[dependencies.pyo3]
version = "0.27.2"
features = ["extension-module"]
optional = true

[[bin]]
name = "rustkmer"
path = "src/main.rs"

[features]
default = []
python = ["pyo3"]
profiling = []
