[package]
name = "rustkmer"
version = "0.5.0"
edition = "2021"
authors = ["Forrest Li <forrest@example.com>"]
description = "High-performance k-mer counting tool in Rust"
license = "MIT"
repository = "https://github.com/yourusername/rustkmer"
keywords = ["bioinformatics", "genomics", "kmer", "sequencing"]
categories = ["science", "command-line-utilities"]

[dependencies]
# CLI framework
clap = { version = "4.5.53", features = ["derive"] }


# Error handling
thiserror = "2.0.17"
anyhow = "1.0"

# Bioinformatics
bio = "2.0"

# Memory management
memmap2 = "0.9"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"
bincode = "1.3"

# Binary I/O
byteorder = "1.5"

# CSV support
csv = "1.3"

# Small vector optimization
smallvec = "1.13"

# High-performance hash map
hashbrown = "0.14"
ahash = "0.8"

# Iterator utilities
itertools = "0.14"

# Streaming quantile estimation
tdigest = "0.2"

# Synchronization primitives
parking_lot = "0.12"

# Parallel processing
rayon = "1.8"

# Concurrent sharded hash map (Phase 2; PCOUNT-02)
# dashmap 6.2.1 pins hashbrown ^0.14.5 — reuses the project's existing
# hashbrown 0.14.5 with no duplicate-version bloat (RESEARCH-verified).
dashmap = "6.2.1"

# Progress reporting
indicatif = "0.17"

# Interactive file selection
inquire = "0.7"

# Directory traversal
walkdir = "2.4"

# Compression support
# niffler = "2.5"  # Commented out to avoid zstd issues
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
bzip2 = "0.4"
xz2 = "0.1"

# Additional compression for database persistence
sha2 = "0.10"

# Date/time handling for metadata
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# System information
sys-info = "0.9"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
tempfile = "3.12"
proptest = "1.5"

# Source-tree introspection for the CJK string-literal lint (plan 01-04, D-07).
# Added here in 01-03 because Cargo.toml is already touched; both are
# dev-only so they do not affect the release binary.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
proc-macro2 = "1.0"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "rustkmer"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "rustkmer"
path = "src/main.rs"

# [[bench]]
# name = "python_cli_comparison"
# harness = false

[features]
default = []
profiling = []
# Disable zstd to avoid compilation issues
disable-zstd = []
