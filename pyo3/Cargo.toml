[package]
name = "rustkmer-pyo3"
version = "0.5.0"
edition = "2021"
authors = ["RustKmer Team <team@rustkmer.org>"]
description = "High-performance PyO3 Python bindings for rustkmer k-mer library"
license = "MIT"
repository = "https://github.com/rustkmer/rustkmer"
keywords = ["bioinformatics", "genomics", "kmer", "pypy3", "native-extension"]
categories = ["science", "development-tools"]

[lib]
name = "pyrustkmer"
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific dependencies

[dependencies]
# PyO3 - Python bindings
pyo3 = { version = "0.27.2" }

# RustKmer core library
rustkmer = { path = ".." }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Binary I/O
byteorder = "1.5"

# Memory mapping
memmap2 = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Performance and utilities
parking_lot = "0.12"
hashbrown = "0.14"

# Parallel processing — PyCounter::new configures the global rayon pool
# (parity with the CLI --threads flag, D-08/PCOUNT-03). Already a transitive
# dependency via the rustkmer path dep, so declaring it here is an honest
# no-bloat direct declaration (the lockfile entry is shared).
rayon = "1.8"

# Compression support
flate2 = "1.0"

# Logging — surfaces the discarded `build_global` Err under RUST_LOG=warn
# (IN-04). Already a transitive dependency via the rustkmer path dep, so
# declaring it here shares the lockfile entry (no version bloat).
log = "0.4"

[build-dependencies]
pyo3-build-config = "0.22"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
# Optimize for performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Optimize for debugging
opt-level = 0
debug = true

[package.metadata.maturin]
# Maturin configuration
features = ["extension-module"]
python-source = "."
module-name = "pyrustkmer"